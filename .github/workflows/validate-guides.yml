name: Validate framework guides

on:
  pull_request:
    paths:
      - "docs/**"
      - "templates/**"
      - "tools/**"
      - "tests/**"
      - "README.md"
      - "SOURCES.md"
      - ".github/workflows/validate-guides.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "templates/**"
      - "tools/**"
      - "tests/**"
      - "README.md"
      - "SOURCES.md"
      - ".github/workflows/validate-guides.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate guide safety and index integrity
        run: python3 tools/validate_guides.py
      - name: Validate refresh inventory and draft structure
        run: python3 tools/validate_refresh.py
      - name: Test refresh completeness safeguards
        run: python3 -m unittest discover -s tests -v
