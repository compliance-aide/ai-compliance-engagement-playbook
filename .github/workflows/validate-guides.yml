name: Validate framework guides

on:
  pull_request:
    paths:
      - "docs/frameworks/**"
      - "tools/validate_guides.py"
      - ".github/workflows/validate-guides.yml"
  push:
    branches:
      - main
    paths:
      - "docs/frameworks/**"
      - "tools/validate_guides.py"
      - ".github/workflows/validate-guides.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate guide safety and index integrity
        run: python3 tools/validate_guides.py
